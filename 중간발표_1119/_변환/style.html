<style>
:root{--bg:#F6F5F1;--surface:#fff;--ink:#141E33;--ink-2:#36425A;--line:#C9CFDA;--soft:#EEF1F5;--accent:#1747C7;--note:#7A4800;--note-bg:#FDF0D5}
@media (prefers-color-scheme: dark){:root{--bg:#11161F;--surface:#182030;--ink:#F0F3F8;--ink-2:#C3CBD8;--line:#3A4558;--soft:#222C3C;--accent:#8DB0FF;--note:#F2B656;--note-bg:#3A2C12}}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;line-height:1.65;word-break:keep-all}
.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 48px}
h1{font-size:1.8rem;letter-spacing:-.5px;margin:0 0 12px}
h2{font-size:1.3rem;margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:1.1rem;margin:22px 0 8px}
p{margin:8px 0}
a{color:var(--accent)}
code{background:var(--soft);border-radius:6px;padding:1px 6px;font-family:Consolas,monospace;font-size:.92em}
pre{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto}
pre code{background:none;padding:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:10px 0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;font-size:.95rem}
th{background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
blockquote{margin:12px 0;background:var(--note-bg);color:var(--note);border-radius:12px;padding:10px 16px;font-weight:600}
blockquote p{margin:0}
ul,ol{padding-left:1.3em}
li{margin:3px 0}
.meta{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:18px;color:var(--ink-2);font-size:.95rem}
.meta b{color:var(--ink)}
</style>
