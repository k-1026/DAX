<script>
(function(){
  var frames = Array.prototype.slice.call(document.querySelectorAll('iframe')), cur = 0;
  var pick = document.getElementById('pick');
  frames.forEach(function(f, i){ var o = document.createElement('option'); o.value = i; o.textContent = (i + 1) + '. ' + f.dataset.name; pick.appendChild(o); });
  function show(i){
    cur = Math.max(0, Math.min(frames.length - 1, i));
    frames.forEach(function(f, k){ f.classList.toggle('on', k === cur); });
    pick.value = cur;
    document.getElementById('count').textContent = (cur + 1) + ' / ' + frames.length;
    document.getElementById('prev').disabled = cur === 0;
    document.getElementById('next').disabled = cur === frames.length - 1;
    try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  }
  function key(k){
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') show(cur + 1);
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') show(cur - 1);
    else if (k === 'Home') show(0);
    else if (k === 'End') show(frames.length - 1);
    else if (k === 'f' || k === 'F'){ if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }
  }
  document.addEventListener('keydown', function(e){ if (e.target === pick) return; key(e.key); });
  window.addEventListener('message', function(e){ if (e.data && e.data.deckKey) key(e.data.deckKey); });
  document.getElementById('prev').addEventListener('click', function(){ show(cur - 1); });
  document.getElementById('next').addEventListener('click', function(){ show(cur + 1); });
  pick.addEventListener('change', function(){ show(+pick.value); });
  var h = parseInt(location.hash.slice(1), 10);
  show(h >= 1 && h <= frames.length ? h - 1 : 0);
})();
</script>
