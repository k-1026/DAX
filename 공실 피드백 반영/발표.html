    &lt;div class=&quot;card&quot;&gt;&lt;p style=&quot;margin:0&quot;&gt;소규모 상가 공실률&lt;/p&gt;&lt;div class=&quot;big&quot; style=&quot;color:var(--pain)&quot;&gt;3.6&lt;small&gt;배&lt;/small&gt;&lt;/div&gt;&lt;p&gt;2019년 3.0% → 2026년 10.8%&lt;/p&gt;&lt;/div&gt;

th{background:var(--soft); white-space:nowrap; font-size:1.2rem}
tr:last-child td{border-bottom:0}
td.c{text-align:center; font-weight:700; font-size:1.5rem}
.o{color:var(--ok)} .x{color:var(--pain)} .t{color:var(--warn)}
tr.us td{background:var(--accent-bg); font-weight:700}

/* 빽빽한 장: 글씨는 그대로 두고, 제목 → 숫자 → 짧은 설명 순서로 읽히게 */
.chev{background:var(--ink); color:var(--bg); padding:.6rem .5rem .6rem 1.5rem; font-weight:700; font-size:1.25rem; text-align:center; clip-path:polygon(0 0, calc(100% - 1rem) 0, 100% 50%, calc(100% - 1rem) 100%, 0 100%, 1rem 50%)}
.chev.first{clip-path:polygon(0 0, calc(100% - 1rem) 0, 100% 50%, calc(100% - 1rem) 100%, 0 100%); padding-left:.5rem}
.chev small{display:block; font-weight:400; font-size:.98rem; opacity:.85}
.chev.hl{background:var(--ok)}
.col{display:flex; flex-direction:column; gap:.6rem; min-width:0; min-height:0}
.sub{font-size:1.08rem; color:var(--ink-3); text-align:center; min-height:2.9rem}
.box{background:var(--surface); border:.1rem solid var(--line); border-radius:.8rem; padding:.75rem .85rem; min-height:0}
.box.pain{background:var(--pain-bg); border-color:transparent}
.box.pain b{display:block; font-size:1.22rem; line-height:1.3}
.box.pain .pn{color:var(--pain); font-size:1rem; font-weight:700}
.num{font-size:2.5rem; font-weight:700; line-height:1.1; letter-spacing:-.05rem; font-variant-numeric:tabular-nums}
.cap{font-size:1.05rem; color:var(--ink-2); margin-top:.15rem}
.svc{font-size:1.08rem; color:var(--ink-2)}
.col.hot .box{border-color:var(--pain); border-width:.18rem}
.rowlab{font-size:1.1rem; font-weight:700; color:var(--ink-3); letter-spacing:.02rem}
.addc{background:var(--ok-bg); border:.16rem solid var(--ok); border-radius:1rem; padding:.9rem 1rem; min-height:0; display:flex; flex-direction:column; gap:.4rem}
.addc .at{display:inline-block; align-self:flex-start; background:var(--ok); color:#fff; font-weight:700; font-size:1.05rem; border-radius:99rem; padding:.1rem .8rem}
.addc b{font-size:1.3rem; line-height:1.3}
.addc ul{margin:0; padding-left:1.1rem; font-size:1.12rem; color:var(--ink-2)}
.addc li + li{margin-top:.2rem}
.addc .tags{margin-top:auto; display:flex; flex-wrap:wrap; gap:.3rem}
@media (prefers-color-scheme: dark){ .addc .at{color:#0C1322} }

<div class="nav">
  <button type="button" id="prev" aria-label="이전 장">◀</button>
  <button type="button" id="next" aria-label="다음 장">▶</button>
  <select id="pick" aria-label="장 고르기"></select>
  <span id="count"></span>
  <span class="sp"></span>
  <span class="hint">← → 키나 스페이스로 넘기기 · F 전체 화면</span>
</div>
<script>
(function(){
  var frames = Array.prototype.slice.call(document.querySelectorAll('iframe')), cur = 0;
  var pick = document.getElementById('pick');
  frames.forEach(function(f, i){ var o = document.createElement('option'); o.value = i; o.textContent = (i + 1) + '. ' + f.dataset.name; pick.appendChild(o); });
  function show(i){
    cur = Math.max(0, Math.min(frames.length - 1, i));
    frames.forEach(function(f, k){ f.classList.toggle('on', k === cur); });
    pick.value = cur;
    document.getElementById('count').textContent = (cur + 1) + ' / ' + frames.length;
    document.getElementById('prev').disabled = cur === 0;
    document.getElementById('next').disabled = cur === frames.length - 1;
    try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  }
  function key(k){
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') show(cur + 1);
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') show(cur - 1);
    else if (k === 'Home') show(0);
    else if (k === 'End') show(frames.length - 1);
    else if (k === 'f' || k === 'F'){ if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }
  }
  document.addEventListener('keydown', function(e){ if (e.target === pick) return; key(e.key); });
  window.addEventListener('message', function(e){ if (e.data && e.data.deckKey) key(e.data.deckKey); });
  document.getElementById('prev').addEventListener('click', function(){ show(cur - 1); });
  document.getElementById('next').addEventListener('click', function(){ show(cur + 1); });
  pick.addEventListener('change', function(){ show(+pick.value); });
  window.addEventListener('hashchange', function(){ var n = parseInt(location.hash.slice(1), 10); if (n >= 1 && n <= frames.length && n - 1 !== cur) show(n - 1); });
  var h = parseInt(location.hash.slice(1), 10);
  show(h >= 1 && h <= frames.length ? h - 1 : 0);
})();
</script>
