const GU_COLOR={"달서구":"#2563eb"};
const PAGE=100;
const uniq=k=>[...new Set(DATA.map(r=>r[k]).filter(Boolean))].sort();
const fill=(id,vals)=>{const s=document.getElementById(id);vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;s.appendChild(o)})};
fill("fType",uniq("type"));fill("fTrade",uniq("trade"));fill("fFloor",uniq("floor"));
document.getElementById("cardAll").textContent=DATA.length;

const map=L.map("map").setView([35.8380,128.5330],13);
L.tileLayer("https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png",{attribution:"VWorld",maxZoom:18}).addTo(map);
const layer=L.layerGroup().addTo(map);
const markers=new Map();
DATA.forEach(r=>{
  if(r.lat==null||r.lng==null||r.lat==="") return;
  const m=L.circleMarker([r.lat,r.lng],{radius:6,color:"#fff",weight:1,fillColor:GU_COLOR[r.gu]||"#2563eb",fillOpacity:0.9});
  m.bindPopup(()=>'<b>'+r.id+'</b><br>'+r.type+' · '+r.trade+' · '+r.floor+'<br>'+r.dong+'<br>전용 '+r.area+'㎡ · 보증금 '+(r.deposit??'-')+'만원 · 월세 '+(r.rent??'-')+'만원<br>'+r.purpose+'<br>'+(r.broker||'')+' · 확인 '+r.confirm+'<br><a href="'+r.link+'" target="_blank">네이버 매물 보기</a>');
  markers.set(r.id,m);
});
let filtered=[], page=0;
function apply(){
  const gu=document.getElementById("fGu").value, t=document.getElementById("fType").value, tr=document.getElementById("fTrade").value, fl=document.getElementById("fFloor").value, q=document.getElementById("q").value.trim();
  filtered=DATA.filter(r=>(!gu||r.gu===gu)&&(!t||r.type===t)&&(!tr||r.trade===tr)&&(!fl||r.floor===fl)&&(!q||JSON.stringify(r).includes(q)));
  const so=document.getElementById("fSort").value;
  const num=v=>v===""||v==null?Infinity:Number(v);
  if(so==="confirm-desc") filtered.sort((a,b)=>(b.confirm>a.confirm?1:b.confirm<a.confirm?-1:0));
  if(so==="deposit-asc") filtered.sort((a,b)=>num(a.deposit)-num(b.deposit));
  if(so==="rent-asc") filtered.sort((a,b)=>num(a.rent)-num(b.rent));
  if(so==="area-desc") filtered.sort((a,b)=>num(b.area===""?-1:b.area)-num(a.area===""?-1:a.area));
  page=0; draw();
}
function draw(){
  layer.clearLayers();
  filtered.forEach(r=>{const m=markers.get(r.id); if(m) layer.addLayer(m);});
  const pages=Math.max(1,Math.ceil(filtered.length/PAGE));
  const slice=filtered.slice(page*PAGE,(page+1)*PAGE);
  document.getElementById("list").innerHTML=slice.map(r=>'<div class="item" data-id="'+r.id+'"><div class="t">'+r.type+' · '+r.trade+' · '+r.floor+' · '+r.dong+'</div><div class="m">'+(r.detail||'')+' · 전용 '+r.area+'㎡ · 보증금 '+(r.deposit??'-')+' / 월세 '+(r.rent??'-')+'만원</div><div class="m">'+r.purpose+' · '+(r.broker||'')+' · 확인 '+r.confirm+(r.lat===""?' · (좌표 없음)':'')+'</div></div>').join("");
  document.getElementById("count").textContent=filtered.length+"건 (100건씩 표시)";
  document.getElementById("cardShown").textContent=filtered.length;
  document.getElementById("pg").textContent=(page+1)+" / "+pages;
  document.getElementById("prev").disabled=page===0;
  document.getElementById("next").disabled=page>=pages-1;
  if(filtered.length && layer.getLayers().length) { /* keep view */ }
}
document.getElementById("list").addEventListener("click",e=>{const it=e.target.closest(".item"); if(!it) return; const m=markers.get(it.dataset.id); if(m){ map.setView(m.getLatLng(),17); m.openPopup(); }});
["fGu","fType","fTrade","fFloor","fSort"].forEach(id=>document.getElementById(id).addEventListener("change",apply));
document.getElementById("q").addEventListener("input",apply);
document.getElementById("prev").onclick=()=>{if(page>0){page--;draw();}};
document.getElementById("next").onclick=()=>{if((page+1)*PAGE<filtered.length){page++;draw();}};
apply();
</script></body></html>
