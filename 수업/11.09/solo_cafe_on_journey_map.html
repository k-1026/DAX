<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D: ON 고객 여정 지도</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f6f4ef;--ink:#1d1d24;--muted:#6b6b76;--line:#d9d6cf;--navy:#23304a;--teal:#2f7f7a;--rose:#a94b42;--green:#3f7a4a;--gold:#b08d57}
body{background:#e6e2da;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);padding:24px 16px;display:flex;justify-content:center}
.frame{width:100%;max-width:1280px;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:14px;box-shadow:0 8px 28px rgba(40,30,20,.16);background:var(--bg)}
.canvas{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;padding:34px 44px;background:var(--bg)}
.accent{width:36px;height:3px;background:var(--teal);margin-bottom:12px}
.tag{position:absolute;right:44px;top:34px;font-size:12px;color:var(--teal);background:#fff;border:1px solid #bfdcd7;padding:4px 12px;border-radius:20px;font-weight:700}
h1{font-size:24px;font-weight:800;line-height:1.3}
.sub{font-size:13.5px;color:var(--muted);margin-top:4px}
.board{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px}
.grid{display:grid;grid-template-columns:96px repeat(5,1fr);column-gap:8px;row-gap:0;align-items:stretch}
.stage{background:var(--teal);color:#fff;border-radius:18px;font-weight:700;font-size:15px;text-align:center;height:42px;line-height:42px;margin-bottom:10px}
.lbl{font-size:14px;font-weight:700;color:var(--navy);display:flex;align-items:center;border-top:1px solid #ece9e2;padding:14px 0}
.cell{font-size:14px;line-height:1.45;text-align:center;display:flex;align-items:center;justify-content:center;padding:14px 6px;border-top:1px solid #ece9e2;color:#2b2b33;min-height:58px}
.cell.thought{font-style:normal;color:#55555f}
.cell.pain{color:var(--rose);font-weight:600}
.cell.opp{color:var(--green);font-weight:600}
.cell.emo{padding:0;height:150px;min-height:150px;border-top:1px solid #ece9e2}
.cell.emo svg{width:100%;height:100%}
.emo-label{font-size:14px;font-weight:700;color:var(--navy);display:flex;align-items:center;border-top:1px solid #ece9e2}
.foot{position:absolute;left:44px;bottom:12px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="frame">
  <div class="canvas">
    <div class="accent"></div>
    <div class="tag">D: ON · 고객 여정 지도</div>
    <h1>여정 지도의 층 구조 — 1인 카페 창업 · 첫 가게 준비 예시</h1>
    <p class="sub">가로는 여정 단계, 세로는 층. 위에서 아래로 행동 → 생각 → 감정 → 터치포인트 → 페인포인트 → 기회 순으로 읽습니다.</p>

    <div class="board">
      <div class="grid" id="grid"></div>
    </div>

    <div class="foot">※ 감정 곡선은 입력이 없어 추정했습니다. 생각·터치포인트·페인포인트·기회도 일반적인 창업 준비 패턴을 바탕으로 한 예시입니다.</div>
  </div>
</div>

<script>
const stages = ["카테고리 정하기", "매물 알아보기", "AI 맞춤 추천 참고", "거르기", "구매하기"];
const rows = {
  action:  ["업종·예산 기준 정하기", "지역별 매물 검색", "AI 추천 결과 확인", "조건 안 맞는 매물 제외", "계약·구매 진행"],
  thought: ["나한테 맞는 카페는 뭘까?", "매물이 너무 많아…", "이 추천 믿어도 될까?", "이건 아니고, 이건 괜찮네", "드디어 내 가게!"],
  emotion: ["설렘", "막막함", "기대 회복", "고민", "뿌듯함"],
  score:   [80, 38, 68, 40, 90],
  touch:   ["창업 커뮤니티·유튜브", "부동산 매물 앱·상권 정보", "AI 추천 서비스", "매물 비교 메모·현장 방문", "임대차 계약·사업자 등록"],
  pain:    ["업종 선택 기준 부족", "정보가 여러 곳에 흩어짐", "추천 근거가 불투명함", "비교 기준이 일관되지 않음", "계약 조건 확인 부담"],
  opp:     ["업종별 체크리스트 제공", "매물 한곳에서 통합 비교", "추천 이유를 함께 표시", "조건별 자동 거르기", "계약 전 점검 체크리스트"]
};

const grid = document.getElementById('grid');
const labelDefs = [["행동","action"],["생각","thought"],["감정","emotion"],["터치포인트","touch"],["페인포인트","pain"],["기회","opp"]];

// 단계 헤더
let html = '<div></div>';
stages.forEach(s => { html += `<div class="stage">${s}</div>`; });

// 행동, 생각
for (const [label, key] of labelDefs.slice(0, 2)) {
  html += `<div class="lbl">${label}</div>`;
  rows[key].forEach(t => { html += `<div class="cell ${key === 'thought' ? 'thought' : ''}">${key === 'thought' ? '“' + t + '”' : t}</div>`; });
}

// 감정 곡선 (SVG, 5열 중심 좌표 계산)
html += `<div class="emo-label">감정</div>`;
const colW = (1074 - 4 * 8) / 5; // 보드 내부 열 폭 근사치
const VH = 150;
const pts = rows.score.map((sc, i) => [colW / 2 + i * (colW + 8), VH - 20 - sc * (VH - 40) / 100]);
let svg = `<svg viewBox="0 0 1074 ${VH}" preserveAspectRatio="none">`;
svg += `<polyline fill="none" stroke="#2f7f7a" stroke-width="3" vector-effect="non-scaling-stroke" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
svg += '</svg>';
html += `<div class="cell emo" style="grid-column:2 / span 5;position:relative">${svg}${rows.emotion.map((e, i) => {
  const x = (pts[i][0] / 1074 * 100).toFixed(2);
  const y = (pts[i][1] / VH * 100).toFixed(2);
  return `<div style="position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-135%);font-size:12.5px;font-weight:700;color:#23304a;white-space:nowrap">${e}</div>` +
         `<div style="position:absolute;left:${x}%;top:${y}%;width:11px;height:11px;border-radius:50%;background:${i === 1 || i === 3 ? '#b5584f' : '#23304a'};transform:translate(-50%,-50%)"></div>`;
}).join('')}</div>`;

// 터치포인트, 페인포인트, 기회
for (const [label, key] of labelDefs.slice(3)) {
  html += `<div class="lbl">${label}</div>`;
  rows[key].forEach(t => {
    const cls = key === 'pain' ? 'pain' : key === 'opp' ? 'opp' : '';
    html += `<div class="cell ${cls}">${t}</div>`;
  });
}
grid.innerHTML = html;

function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    f.querySelector('.canvas').style.transform = 'scale(' + (f.clientWidth / 1280) + ')';
  });
}
window.addEventListener('resize', fit);
fit();
</script>
</body>
</html>
